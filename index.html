<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéFinder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>⚡ PokéFinder</h1>

        <p>Pesquise um Pokémon pelo nome ou número.</p>

        <div class="busca">
            <input 
                type="text" 
                id="campo-busca" 
                placeholder="Ex: pikachu"
            >

            <button id="botao-buscar">Buscar</button>
        </div>

        <section id="resultado">
            <p>Digite um Pokémon para começar.</p>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
