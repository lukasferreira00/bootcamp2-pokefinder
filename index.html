<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéFinder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>⚡ PokéFinder</h1>

        <p>Pesquise um Pokémon pelo nome ou número.</p>

        <div class="busca">
            <input
                type="text"
                id="campo-busca"
                placeholder="Ex: pikachu"
            >

            <button id="botao-buscar">Buscar</button>
        </div>

        <section id="resultado">
            <p>Digite um Pokémon para começar.</p>
        </section>

        <section id="meu-time">
            <h2>⭐ Meu time</h2>
            <ul id="lista-time">
                <li>Carregando...</li>
            </ul>
        </section>
        <footer class="rodape">
            PokéFinder v1.1 · feito com Supabase e Docker
        </footer>
    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
